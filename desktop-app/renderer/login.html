<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>NeuroSync Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@400;600;700&family=Sora:wght@400;600;700&display=swap');
  :root {
    --bg: #09090B;
    --bg-card: #17181D;
    --bg-elevated: #1F2026;
    --pink: #FC1FF9;
    --pink-glow: rgba(252, 31, 249, 0.3);
    --purple: #BC0EEF;
    --text: #FFFFFF;
    --text-dim: #A8A8B3;
    --red: #E42536;
    --border: rgba(255, 255, 255, 0.08);
    --font-mono: 'Share Tech Mono', monospace;
    --font-ui: 'Space Grotesk', 'Sora', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  #titlebar {
    -webkit-app-region: drag;
    height: 38px;
    background: #09090B;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
  }
  .logo { color: var(--pink); font-family: var(--font-ui); font-weight: 700; font-size: 12px; letter-spacing: 4px; flex: 1; text-shadow: 0 0 10px var(--pink-glow); }
  .winbtn {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .winbtn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .winbtn.close:hover { background: rgba(228,37,54,0.25); color: var(--red); }
  #main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 2px 2px 4px rgba(255,255,255,0.03), inset -4px -4px 8px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .inner { padding: 32px 28px; }
  .ns-logo { text-align: center; margin-bottom: 24px; }
  .ns-logo .ring {
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--pink);
    box-shadow: 0 0 20px var(--pink-glow), inset 2px 2px 5px rgba(0,0,0,0.6);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 12px; position: relative;
  }
  .ns-logo .ring span { font-family: var(--font-mono); font-size: 15px; color: var(--pink); font-weight: bold; }
  .ns-logo h1 { font-size: 22px; letter-spacing: 5px; color: var(--text); font-weight: 700; text-shadow: 0 0 10px var(--pink-glow); }
  .ns-logo p  { font-family: var(--font-ui); font-size: 9px; color: var(--text-dim); letter-spacing: 2px; margin-top: 4px; font-weight: 600; }
  .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); }
  .divider-label { font-family: var(--font-ui); font-size: 9px; color: var(--text-dim); letter-spacing: 3px; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-family: var(--font-ui); font-size: 9px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 1px;
    outline: none; transition: border-color 0.25s, box-shadow 0.25s;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
  }
  .field input:focus { border-color: var(--pink); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5), 0 0 15px var(--pink-glow); }
  #error-msg { font-family: var(--font-mono); font-size: 10px; color: var(--red); letter-spacing: 1px; margin-bottom: 12px; min-height: 16px; text-align: center; }
  #login-btn {
    width: 100%; background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none; border-radius: 10px; padding: 14px; color: #FFFFFF;
    font-family: var(--font-ui); font-size: 13px; font-weight: 700;
    letter-spacing: 3px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 25px var(--pink-glow);
  }
  #login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px var(--pink-glow); }
  #login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .status { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-align: center; margin-top: 16px; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="titlebar">
  <span class="logo">NEUROSYNC</span>
  <button class="winbtn" onclick="window.electronAPI.minimizeWindow()">─</button>
  <button class="winbtn close" onclick="window.electronAPI.closeWindow()">✕</button>
</div>

<div id="main">
  <div class="card">
    <div class="corner-b"></div>
    <div class="inner">
      <div class="ns-logo">
        <div class="ring"><span>NS</span></div>
        <h1>NEUROSYNC</h1>
        <p>DESKTOP CONTROL AGENT v1.0</p>
      </div>
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-label">AUTHENTICATION</span>
        <div class="divider-line"></div>
      </div>
      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="email" placeholder="user@domain.com" autocomplete="off"/>
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input type="password" id="password" placeholder="••••••••" style="padding-right: 42px;"/>
          <button type="button" id="toggle-pw-btn" onclick="togglePasswordVisibility()" title="Toggle Password Visibility" style="position: absolute; right: 10px; background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.2s;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div id="error-msg"></div>
      <button id="login-btn" onclick="handleLogin()">AUTHENTICATE →</button>
      <p class="status" id="status-text">// ENTER CREDENTIALS TO CONNECT</p>
    </div>
  </div>
</div>

<script>
  const eyeIconSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const eyeOffIconSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

  function togglePasswordVisibility() {
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pw-btn');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      toggleBtn.innerHTML = eyeOffIconSvg;
      toggleBtn.style.color = 'var(--pink)';
    } else {
      pwInput.type = 'password';
      toggleBtn.innerHTML = eyeIconSvg;
      toggleBtn.style.color = 'var(--text-dim)';
    }
  }

  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-msg');
    const statusEl = document.getElementById('status-text');
    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = '// EMAIL AND PASSWORD REQUIRED'; return; }
    btn.disabled = true;
    btn.textContent = 'AUTHENTICATING...';
    statusEl.textContent = '// CONNECTING TO BACKEND...';
    try {
      const result = await window.electronAPI.login(email, password);
      if (result.success) {
        statusEl.textContent = '// AUTHENTICATED — LAUNCHING DASHBOARD...';
      } else {
        errEl.textContent = '// ' + (result.error || 'AUTHENTICATION FAILED').toUpperCase();
        btn.disabled = false;
        btn.textContent = 'AUTHENTICATE →';
        statusEl.textContent = '// ENTER CREDENTIALS TO CONNECT';
      }
    } catch {
      errEl.textContent = '// COULD NOT REACH BACKEND';
      btn.disabled = false;
      btn.textContent = 'AUTHENTICATE →';
    }
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
  window.electronAPI.getSavedEmail().then(email => {
    if (email) document.getElementById('email').value = email;
  });
</script>
</body>
</html>
